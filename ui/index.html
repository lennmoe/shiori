<!doctype html>
<html lang="en" data-mode="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visual Novel RPC</title>

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <link rel="stylesheet" href="css/labs.css" />

    <script type="module" src="js/app.js"></script>
  </head>

  <body class="main-window">
    <div id="app-bg" aria-hidden="true"></div>

        <img src="assets/app_icon.png" alt="" />
        <div>
          <b>Visual Novel</b>
          <span>RPC</span>

      </div>

        <button data-page="library">Library</button>

        <button data-page="share">Share</button>
        <button data-page="mascots">Mascots</button>
        <button data-page="settings">Settings</button>
